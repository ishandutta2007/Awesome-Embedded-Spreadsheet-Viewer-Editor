<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .cell-pulse {
      animation: cellBlink 4s infinite ease-in-out;
    }
    @keyframes cellBlink {
      0%, 100% { fill-opacity: 0.15; }
      50% { fill-opacity: 0.55; }
    }
    .flow-dash {
      stroke-dasharray: 8 6;
      animation: dashFlow 15s linear infinite;
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -140; }
    }
    .orb-float-1 {
      animation: floatOrb1 9s ease-in-out infinite alternate;
    }
    .orb-float-2 {
      animation: floatOrb2 12s ease-in-out infinite alternate;
    }
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(45px, 25px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-35px, -30px) scale(1.2); }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
    }
    .mono-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs in Background -->
  <g filter="url(#glow)">
    <circle class="orb-float-1" cx="240" cy="90" r="130" fill="#0284c7" fill-opacity="0.22" />
    <circle class="orb-float-2" cx="960" cy="330" r="160" fill="#10b981" fill-opacity="0.18" />
    <circle class="orb-float-1" cx="800" cy="80" r="110" fill="#6366f1" fill-opacity="0.2" />
  </g>

  <!-- Spreadsheet Architectural Grid Pattern Background -->
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Dynamic Spreadsheet Wireframe Background Elements -->
  <g opacity="0.38" transform="translate(740, 45)">
    <!-- Spreadsheet Mock Table -->
    <rect x="0" y="0" width="410" height="230" rx="8" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" />
    
    <!-- Table Header Row -->
    <rect x="1" y="1" width="408" height="34" rx="7" fill="#1e293b" />
    <line x1="0" y1="35" x2="410" y2="35" stroke="#475569" stroke-width="1" />
    
    <!-- Columns Lines -->
    <line x1="60" y1="0" x2="60" y2="230" stroke="#334155" stroke-width="1" />
    <line x1="150" y1="0" x2="150" y2="230" stroke="#334155" stroke-width="1" />
    <line x1="260" y1="0" x2="260" y2="230" stroke="#334155" stroke-width="1" />
    <line x1="340" y1="0" x2="340" y2="230" stroke="#334155" stroke-width="1" />

    <!-- Horizontal Row Lines -->
    <line x1="0" y1="68" x2="410" y2="68" stroke="#334155" stroke-width="1" />
    <line x1="0" y1="102" x2="410" y2="102" stroke="#334155" stroke-width="1" />
    <line x1="0" y1="136" x2="410" y2="136" stroke="#334155" stroke-width="1" />
    <line x1="0" y1="170" x2="410" y2="170" stroke="#334155" stroke-width="1" />
    <line x1="0" y1="204" x2="410" y2="204" stroke="#334155" stroke-width="1" />

    <!-- Animated Data Cells -->
    <rect class="cell-pulse" x="61" y="36" width="88" height="31" fill="#38bdf8" />
    <rect class="cell-pulse" x="151" y="69" width="108" height="32" fill="#34d399" style="animation-delay: 1.2s;" />
    <rect class="cell-pulse" x="261" y="137" width="78" height="32" fill="#818cf8" style="animation-delay: 2.1s;" />

    <!-- Cell Mock Texts -->
    <text x="30" y="22" fill="#94a3b8" class="mono-text" font-size="11" text-anchor="middle">#</text>
    <text x="105" y="22" fill="#94a3b8" class="mono-text" font-size="11" text-anchor="middle">A (Formula)</text>
    <text x="205" y="22" fill="#94a3b8" class="mono-text" font-size="11" text-anchor="middle">B (Value)</text>
    <text x="300" y="22" fill="#94a3b8" class="mono-text" font-size="11" text-anchor="middle">C (Status)</text>

    <!-- Formula Bar Floating Pill -->
    <g transform="translate(15, 245)">
      <rect width="380" height="30" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" stroke-opacity="0.8" />
      <text x="12" y="19" fill="#38bdf8" class="mono-text" font-size="11">fx  =SUM(C2:C50) * VLOOKUP(A1, Matrix, 2, FALSE)</text>
    </g>
  </g>

  <!-- Flowing Dynamic Data Waves -->
  <path class="flow-dash" d="M -50 360 Q 250 310, 550 365 T 1150 330 T 1300 370" fill="none" stroke="url(#accentLine)" stroke-width="2.5" />
  <path class="flow-dash" d="M -50 380 Q 300 340, 650 385 T 1250 350" fill="none" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- FOREGROUND CONTENT: Header, Badge, Title, Subtitle, Feature Pills -->
  <g transform="translate(80, 0)">
    
    <!-- Top Category Pill / Meta Badge -->
    <g transform="translate(0, 58)">
      <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="32" y="20" fill="#e2e8f0" class="sub-text" font-size="13" font-weight="600">AWESOME CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text" font-size="46" fill="#f8fafc">
      Embedded Spreadsheet
    </text>
    <text x="0" y="198" class="title-text" font-size="42" fill="url(#textGrad)">
      Viewer &amp; Editor Ecosystem
    </text>

    <!-- Subtitle & Focus Area -->
    <text x="0" y="246" class="sub-text" font-size="17" fill="#94a3b8">
      In-App Excel-Like Grids • High-Fidelity Formula Engines • White-Label Workbooks
    </text>
    <text x="0" y="272" class="sub-text" font-size="15" fill="#64748b">
      Curated architectural comparison of enterprise SaaS components &amp; open-source frameworks.
    </text>

    <!-- Feature Pills Container -->
    <g transform="translate(0, 312)">
      <!-- Pill 1: Canvas Rendering -->
      <g transform="translate(0, 0)">
        <rect width="170" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="85" y="22" fill="#38bdf8" class="sub-text" font-size="13" font-weight="600" text-anchor="middle">⚡ Virtualized Canvas</text>
      </g>

      <!-- Pill 2: 400+ Formulas -->
      <g transform="translate(182, 0)">
        <rect width="170" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="85" y="22" fill="#34d399" class="sub-text" font-size="13" font-weight="600" text-anchor="middle">📐 Formula Engines</text>
      </g>

      <!-- Pill 3: XLSX Parity -->
      <g transform="translate(364, 0)">
        <rect width="165" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="82" y="22" fill="#818cf8" class="sub-text" font-size="13" font-weight="600" text-anchor="middle">📊 Excel XLSX Parity</text>
      </g>

      <!-- Pill 4: Real-time CRDT -->
      <g transform="translate(541, 0)">
        <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="90" y="22" fill="#f472b6" class="sub-text" font-size="13" font-weight="600" text-anchor="middle">🤝 CRDT Collaboration</text>
      </g>
    </g>

  </g>

</svg>
